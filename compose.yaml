# Local development stack. Pinned versions; state lives in named volumes.
name: prospector

services:
  postgres:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n                      # n8n's own internal database
      PROSPECTOR_DB: ${PROSPECTOR_DB}       # prospect store, created by db/init
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot schema migrations (Flyway). Runs on every `docker compose up`; already-applied versions are skipped.
  # Existing databases with no history table are baselined at version 0, so the (idempotent) migrations re-run safely.
  migrate:
    image: flyway/flyway:11
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${PROSPECTOR_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "0"
    volumes:
      - ./db/migrations:/flyway/sql:ro

  n8n:
    image: n8nio/n8n:2.47.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: America/Detroit
      TZ: America/Detroit
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_MCP_MANAGED_BY_ENV: "true"       # instance-level MCP server, enabled via env
      N8N_MCP_ACCESS_ENABLED: "true"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows          # for n8n CLI export/import

volumes:
  pgdata:
  n8n_data:
